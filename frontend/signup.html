<!doctype html>
<html>
  <head>
    <meta name="viewport" content="width=device-width">
    <title>Signup.html</title>
    <!--<link rel="stylesheet" href="style.css"/>-->
    <link rel="stylesheet" href="./output.css">
  </head>
  <body>
    
   <body class="bg-[#eef5f9] min-h-screen flex flex-col justify-between font-sans">

    <!-- Top Navigation Bar -->
    <header class="flex justify-between items-center px-8 py-4">
        <!-- Logo -->
        <a href="#" class="text-[#0f172a] font-semibold text-lg underline underline-offset-4">TaskFlow</a>
        
        <!-- Nav Links -->
        <nav class="space-x-4 text-sm">
            <a href="#" class="text-[#0f172a] hover:underline">Home</a>
            <a href="#" class="text-[#0f172a] hover:underline">Login</a>
            <a href="#" class="text-[#0f172a] hover:underline">Sign up</a>
        </nav>
    </header>

    <!-- Main Content / Signup Card Container -->
    <main class="flex-grow flex items-center justify-center px-4 py-8">
        <div class="bg-white w-full max-w-md p-8 rounded-2xl shadow-xl border border-gray-100">
            
            <!-- Heading & Subtitle -->
            <h1 class="text-2xl font-bold text-[#0d1333] mb-1">Create Your Accounts</h1>
            <p class="text-sm text-gray-600 mb-6">Join TaskFlow and Start managing your task today.</p>
            
            <!-- Signup Form -->
            <form class="space-y-4" onsubmit="event.preventDefault();">
                <!-- Name Field -->
                <div>
                    <label class="block text-sm font-semibold text-[#0d1333] mb-1">Name</label>
                    <input type="text" class="w-full px-3 py-2 border border-gray-400 rounded-md focus:outline-none focus:ring-1 focus:ring-blue-500 bg-white">
                </div>

                <!-- Email Field -->
                <div>
                    <label class="block text-sm font-semibold text-[#0d1333] mb-1">Email</label>
                    <input type="email" class="w-full px-3 py-2 border border-gray-400 rounded-md focus:outline-none focus:ring-1 focus:ring-blue-500 bg-white">
                </div>

                <!-- Password Field -->
                <div>
                    <label class="block text-sm font-semibold text-[#0d1333] mb-1">Password</label>
                    <input type="password" class="w-full px-3 py-2 border border-gray-400 rounded-md focus:outline-none focus:ring-1 focus:ring-blue-500 bg-white">
                </div>

                <!-- Submit Button -->
                <div class="pt-2">
                    <button type="submit" class="px-4 py-1.5 bg-[#f0f0f0] hover:bg-gray-200 text-black text-sm border border-gray-400 rounded cursor-pointer shadow-sm">
                        Create Account
                    </button>
                </div>
            </form>

            <!-- Bottom Redirect Text -->
            <p class="text-xs text-[#0d1333] mt-6">
                Already have an account? <a href="#" class="text-blue-600 underline">Login</a>
            </p>

        </div>
    </main>

</body>
</html>
