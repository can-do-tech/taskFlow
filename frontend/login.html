<!DOCTYPE html>
<html>
    <head>
        <meta name="viewport" content="width=device-width">
        <title>Login.html</title>
         <!--<link rel="stylesheet" href="style.css">-->
         <link rel="stylesheet" href="./output.css">
    </head>
    <body>
        
      <body class="bg-[#eef5f9] min-h-screen p-4 font-sans">

    <!-- Navigation Menu (Hidden by default, shown on hamburger click) -->
    <div id="nav-menu" class="fixed top-14 left-0 w-[260px] h-[300px] bg-white border border-gray-300 p-4 space-y-3 shadow-lg hidden z-50">
        <h2 class="text-2xl font-semibold text-blue-700 border-b-2 border-gray-300 pb-1 mb-3">TaskFlow</h2>
        <a href="#" class="block text-lg font-medium text-gray-900">Home</a>
        <a href="#" class="block text-lg font-medium text-white bg-blue-600 px-2 py-1 rounded">Login</a>
        <a href="#" class="block text-lg font-medium text-gray-900">Sign Up</a>
    </div>

    <!-- Main Login Card Container -->
    <main class="flex justify-center items-center min-h-[80vh]">
        <div class="bg-white w-full max-w-lg rounded-3xl shadow-2xl p-10 border border-gray-100">
            
            <!-- Header Text -->
            <h1 class="text-4xl font-bold text-center text-[#0d1333] mb-3">Login To Taskflow</h1>
            <p class="text-center text-gray-700 text-lg mb-10">Welcome Back, Please enter your details</p>

            <!-- Login Form -->
            <form class="space-y-6" onsubmit="event.preventDefault();">
                <!-- Email Field -->
                <div>
                    <label for="email" class="block text-sm font-bold text-[#0d1333] mb-2">Email</label>
                    <input type="email" id="email" class="w-full px-4 py-3 border border-gray-400 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-300 text-lg bg-white" required>
                </div>

                <!-- Password Field -->
                <div>
                    <label for="password" class="block text-sm font-bold text-[#0d1333] mb-2">Password</label>
                    <input type="password" id="password" class="w-full px-4 py-3 border border-gray-400 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-300 text-lg bg-white" required>
                </div>

                <!-- Remember Me Checkbox -->
                <div class="flex items-center gap-3 py-1">
                    <input type="checkbox" id="remember-me" class="h-5 w-5 accent-blue-600 border-gray-400 rounded focus:ring-0">
                    <label for="remember-me" class="text-lg font-medium text-[#0d1333]">Remember me</label>
                </div>

                <!-- Submit Button -->
                <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-4 px-6 rounded-lg text-xl shadow-md transition duration-200">
                    Login
                </button>
            </form>

            <!-- Footer Text -->
            <p class="text-center text-lg text-[#0d1333] mt-8">
                Don't have a taskflow account? <a href="#" class="font-bold text-blue-700 hover:underline">Signup</a>
            </p>
        </div>
    </main>

    <!-- Script to toggle the nav menu (simulating the user's action) -->
    <script>
        // This is for demonstration to show the nav menu that was partially open in the screenshot
        setTimeout(() => {
            document.getElementById('nav-menu').style.display = 'block';
        }, 500);
    </script>

</body>
</html>
